<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add to Cart Microinteraction Pro - Codea con Horacio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="viewport-desktop">

    <!-- Watermark Codea con Horacio -->
    <div class="watermark">
      <span class="brand">Codea con Horacio</span>
      <span class="tagline">Fast Cart Microinteraction • Vanilla JS</span>
    </div>

    <!-- Escena Central -->
    <div class="scene">
      <button class="cart-btn" id="cartBtn" aria-label="Add to cart button">

        <div class="aura-ring"></div>

        <div class="btn-content">

          <!-- Ícono SVG de Carrito -->
          <div class="cart-wrapper" id="cartWrapper">

            <div class="check-badge" id="checkBadge">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <svg class="cart-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <clipPath id="cart-basket-clip">
                  <path d="M 8,11 L 34,11 L 29,25 L 12,25 Z" />
                </clipPath>
              </defs>

              <path class="cart-path" d="M 3,8 L 8,8 L 12,25 L 29,25 L 34,11 L 8,11" stroke-width="2.3" />
              <path class="cart-path" d="M 12,25 L 14,30 L 27,30 L 29,25" stroke-width="2.1" opacity="0.8" />

              <!-- GRUPO DE PAQUETES -->
              <g clip-path="url(#cart-basket-clip)">
                <g class="packages-group" id="packagesGroup">
                  <rect x="9" y="19" width="10" height="7" rx="1" fill="#8b5cf6" />
                  <path d="M 14,19 L 14,26" stroke="#c4b5fd" stroke-width="1" />

                  <rect x="18" y="18" width="12" height="8" rx="1" fill="#ec4899" />
                  <path d="M 24,18 L 24,26" stroke="#fbcfe8" stroke-width="1" />

                  <rect x="11" y="13" width="11" height="7" rx="1" fill="#f59e0b" />
                  <path d="M 16.5,13 L 16.5,20" stroke="#fef3c7" stroke-width="1" />

                  <rect x="20" y="12" width="11" height="7" rx="1" fill="#06b6d4" />
                  <path d="M 25.5,12 L 25.5,19" stroke="#cffaff" stroke-width="1" />

                  <rect x="14" y="6" width="13" height="7" rx="1" fill="#10b981" />
                  <path d="M 20.5,6 L 20.5,13" stroke="#a7f3d0" stroke-width="1.2" />
                </g>
              </g>

              <path class="cart-path" d="M 14,11 L 16,25" stroke-width="1.2" opacity="0.35" />
              <path class="cart-path" d="M 21,11 L 21,25" stroke-width="1.2" opacity="0.35" />
              <path class="cart-path" d="M 28,11 L 26,25" stroke-width="1.2" opacity="0.35" />
              <path class="cart-path" d="M 10,18 L 31,18" stroke-width="1.2" opacity="0.35" />

              <!-- Ruedas -->
              <g class="cart-wheel" id="wheelBack" style="transform-origin: 15px 33px;">
                <circle cx="15" cy="33" r="3.5" class="cart-path" stroke-width="2" />
                <circle cx="15" cy="33" r="1" fill="#ffffff" />
                <line x1="15" y1="30" x2="15" y2="36" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
              </g>

              <g class="cart-wheel" id="wheelFront" style="transform-origin: 27px 33px;">
                <circle cx="27" cy="33" r="3.5" class="cart-path" stroke-width="2" />
                <circle cx="27" cy="33" r="1" fill="#ffffff" />
                <line x1="27" y1="30" x2="27" y2="36" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
              </g>
            </svg>
          </div>

          <!-- Texto en letras individuales -->
          <div class="text-wrapper" id="textWrapper">
            <div class="word">
              <span class="letter">A</span>
              <span class="letter">d</span>
              <span class="letter">d</span>
            </div>
            <div class="word">
              <span class="letter">t</span>
              <span class="letter">o</span>
            </div>
            <div class="word">
              <span class="letter">C</span>
              <span class="letter">a</span>
              <span class="letter">r</span>
              <span class="letter">t</span>
            </div>
          </div>

        </div>
      </button>

      <span class="hint-text">Click to add</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
